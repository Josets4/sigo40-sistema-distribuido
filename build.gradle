plugins {
    id 'java'
    id 'application'
}

group = 'com.andessur.sigo40'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Librería Gson para los mensajes JSON de las secciones 8 y 9
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.andessur.sigo40.App'
}